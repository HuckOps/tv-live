name: Build Android Release on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 安装pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (pnpm frozen lockfile = npm ci)
        run: pnpm install --frozen-lockfile

      # CI现场生成android工程，git仓库不存在android文件夹
      - name: Expo prebuild generate android
        run: pnpm exec expo prebuild --platform android --clean

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 解码密钥
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      # 生成keystore.properties
      - name: Generate keystore.properties
        env:
          STORE_PWD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PWD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PWD
          EOF

      # CI临时patch build.gradle注入签名配置，git不保存
      - name: Patch build.gradle inject signing config
        working-directory: android/app
        run: |
          cat >> build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      props.load(new FileInputStream(file("keystore.properties")))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes.release.signingConfig = signingConfigs.release
          }
          EOF

      - name: Give gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build release APK & AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
